name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-proof:
    name: Rust and plugin release proof
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install Rojo toolchain
        shell: pwsh
        run: |
          cargo install rokit --version 1.2.0 --locked
          rokit self-install

          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $rokitBin = Join-Path $env:USERPROFILE ".rokit\bin"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $rokitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$cargoBin;$rokitBin;$env:Path"

          rokit install --no-trust-check
          rojo --version

      - name: Check Rust formatting
        run: cargo fmt --check -p rs

      - name: Run static docs and capability drift checks
        run: cargo test -p rs plugin_static_tests

      - name: Run Rust tests
        run: cargo test -p rs

      - name: Build release binary
        run: cargo build --release -p rs

      - name: Rebuild plugin bundle
        run: rojo build plugin/default.project.json --output plugin/rs-bridge-plugin.rbxmx

      - name: Check plugin bundle drift
        shell: pwsh
        run: |
          git diff -- plugin/rs-bridge-plugin.rbxmx
          git diff --quiet -- plugin/rs-bridge-plugin.rbxmx
          if ($LASTEXITCODE -ne 0) {
            Write-Error "plugin/rs-bridge-plugin.rbxmx is stale. Run 'rojo build plugin/default.project.json --output plugin/rs-bridge-plugin.rbxmx' and commit the result."
            exit 1
          }
